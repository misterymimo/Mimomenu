<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addon Hub</title>
<style>
:root{--bg:#f4f5f7;--surface:#fff;--surface2:#eceef2;--line:#e0e3e8;--text:#15181d;--mute:#667085;--accent:#2f9e44;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--surface:#171a1f;--surface2:#1e2229;--line:#272c35;--text:#e8eaed;--mute:#8b93a0;--accent:#4cc65a;--accent-t:#07140a}}
:root[data-theme="dark"]{--bg:#0e1013;--surface:#171a1f;--surface2:#1e2229;--line:#272c35;--text:#e8eaed;--mute:#8b93a0;--accent:#4cc65a;--accent-t:#07140a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}
nav{display:flex;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid var(--line);margin-bottom:20px}
#logo svg{width:28px;height:28px;display:block;shape-rendering:crispEdges}
nav b{font-size:1.1rem;letter-spacing:.2px}
nav span{color:var(--mute);font-size:.85rem;margin-left:auto}
.bar{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;outline:none}
input:focus{border-color:var(--accent)}
.tags{display:flex;gap:8px;overflow-x:auto}
.tag{flex:none;border:1px solid var(--line);background:transparent;color:var(--mute);padding:6px 14px;border-radius:8px;font:inherit;font-size:.88rem;cursor:pointer}
.tag.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.thumb{position:relative;height:150px;display:flex;align-items:center;justify-content:center;background:var(--surface2);
background-image:linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%),linear-gradient(45deg,var(--line) 25%,transparent 25%,transparent 75%,var(--line) 75%);
background-size:28px 28px;background-position:0 0,14px 14px;opacity:1}
.thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,var(--surface2) 25%,transparent 75%)}
.thumb svg{position:relative;z-index:1;width:84px;height:84px;shape-rendering:crispEdges;filter:drop-shadow(0 6px 10px rgba(0,0,0,.25))}
.thumb img{position:relative;z-index:1;width:104px;height:104px;image-rendering:pixelated;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.badge{position:absolute;z-index:2;top:10px;left:10px;font-size:.72rem;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.card h2{margin:0;font-size:1.1rem}
.card p{margin:0;color:var(--mute);font-size:.92rem;flex:1}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.info{font-size:.8rem;color:var(--mute)}
.btn{display:inline-block;text-decoration:none;background:var(--accent);color:var(--accent-t);font-weight:600;font-size:.92rem;padding:9px 18px;border-radius:9px}
.btn:hover{filter:brightness(1.08)}
.btn,.tag{position:relative;overflow:hidden;transition:transform .1s,filter .15s}
.btn:active,.tag:active{transform:scale(.93)}
.card:active{transform:scale(.98)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.35;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.card .rip{opacity:.12}
@keyframes rip{to{transform:scale(1);opacity:0}}
.sm{image-rendering:auto!important;border-radius:50%;object-fit:cover;filter:none!important}
.thumb img.sm{width:112px;height:112px}
.dicon img.sm{width:72px;height:72px}
.don{display:inline-flex;align-items:center;gap:7px;margin-left:auto;text-decoration:none;font-size:.85rem;font-weight:600;color:var(--text);border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:9px;position:relative;overflow:hidden;transition:border-color .15s,transform .1s}
.don:hover{border-color:#e0556a}
.don:active{transform:scale(.94)}
.don svg{width:16px;height:16px;display:block;shape-rendering:crispEdges}
.don.wide{display:flex;justify-content:center;margin:14px 0 0;padding:11px;font-size:.92rem}
.hrt{display:flex;font-style:normal}
.card{cursor:pointer}
@keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
@keyframes back{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
#detail:not([hidden]){animation:enter .38s cubic-bezier(.2,.8,.2,1)}
#home:not([hidden]){animation:back .3s ease-out}
#detail:not([hidden]) .dhead,#detail:not([hidden]) .gal,#detail:not([hidden]) .big,#detail:not([hidden]) .sec{opacity:0;animation:enter .45s cubic-bezier(.2,.8,.2,1) forwards}
#detail .dhead{animation-delay:.05s!important}#detail .gal{animation-delay:.12s!important}#detail .big{animation-delay:.19s!important}
#detail .sec:nth-of-type(3){animation-delay:.24s!important}#detail .sec:nth-of-type(4){animation-delay:.29s!important}#detail .sec:nth-of-type(5){animation-delay:.34s!important}#detail .sec:nth-of-type(6){animation-delay:.39s!important}
@media(prefers-reduced-motion:reduce){#detail,#home,#detail *{animation:none!important;opacity:1!important}}
.back{display:inline-block;color:var(--mute);text-decoration:none;font-size:.92rem;margin-bottom:14px}
.back:hover{color:var(--text)}
.dhead{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.dicon{flex:none;width:88px;height:88px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.dicon svg,.dicon img{width:64px;height:64px;image-rendering:pixelated;shape-rendering:crispEdges}
.dhead h1{margin:2px 0;font-size:1.5rem;line-height:1.2}
.by{color:var(--mute);font-size:.9rem}
.gal{display:flex;gap:12px;overflow-x:auto;margin-bottom:18px;scroll-snap-type:x mandatory}
.gal img{height:200px;border-radius:12px;border:1px solid var(--line);flex:none;scroll-snap-align:start}
.ph{flex:1;min-width:100%;height:170px;border:1px dashed var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:.9rem;background:var(--surface)}
.big{display:block;text-align:center;padding:13px;font-size:1rem}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.sec h3{margin:0 0 8px;font-size:1rem}
.sec p{margin:0;color:var(--mute)}
.sec ul,.sec ol{margin:0;padding-left:20px;color:var(--mute)}
.sec li{margin:4px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.row:last-child{border:0}
.row span{color:var(--mute)}
.cr{display:flex;gap:12px;align-items:center}
.cr p{margin-top:2px;font-size:.88rem}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-t);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.1rem}
.empty{text-align:center;color:var(--mute);padding:50px 0}
footer{text-align:center;color:var(--mute);font-size:.78rem;margin-top:36px}
@media(min-width:640px){.bar{flex-direction:row;align-items:center}input{max-width:320px}}
</style>
</head>

const PAL={r:'#d62f45',R:'#ff7a8a',s:'#2bc9c0',B:'#a8fff5',t:'#168a8a',g:'#6b6b6b',h:'#7a4b1f',G:'#5fa83a',k:'#3f7f2a',d:'#8a5a35',D:'#6b4226'};
const ICONS={
 sword:['......tB','.....tBs','....tBs.','...tBs..','g.tBs...','.ggs....','.hg.....','h.......'],
 heart:['.rr..rr.','rRRrrrrr','rRRrrrrr','rrrrrrrr','.rrrrrr.','..rrrr..','...rr...','........'],
 pickaxe:['..sBBBt.','.sBtttBt','sB...hBt','t...h..t','...h....','..h.....','.h......','h.......'],
 block:['GGGGGGGG','GkGGkGGG','dddddddd','dDddddDd','dddDdddd','ddddddDd','dDdddddd','dddDdddd']
};
function px(n){const g=ICONS[n]||ICONS.block;let r='';g.forEach((row,y)=>{[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`})});return `<svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg">${r}</svg>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const q=document.getElementById('q'),list=document.getElementById('list'),tagsEl=document.getElementById('tags');
let cat='Semua';
const cats=['Semua',...new Set(ADDONS.map(a=>a.cat))];
function render(){
  tagsEl.innerHTML=cats.map(c=>`<button class="tag${c===cat?' on':''}" data-c="${esc(c)}">${esc(c)}</button>`).join('');
  const t=q.value.toLowerCase();
  const r=ADDONS.filter(a=>(cat==='Semua'||a.cat===cat)&&(a.name+a.desc).toLowerCase().includes(t));
  list.innerHTML=r.length?r.map(a=>`<div class="card" data-id="${esc(a.id)}"><div class="thumb"><span class="badge">MC ${esc(a.version)}</span>${a.img?`<img class="${a.smooth?'sm':''}" src="${a.img}" alt="">`:px(a.icon)}</div>
  <div class="body"><div class="cat">${esc(a.cat)}</div><h2>${esc(a.name)}</h2><p>${esc(a.desc)}</p>
  <div class="foot"><span class="info">${esc(a.format)} · ${esc(a.size)}</span><a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener">Download</a></div></div></div>`).join(''):'<div class="empty">Belum ada addon yang cocok.</div>';
}
tagsEl.addEventListener('click',e=>{if(e.target.dataset.c){cat=e.target.dataset.c;render()}});
q.addEventListener('input',render);
const detail=document.getElementById('detail');
function ico(a){return a.img?`<img class="${a.smooth?'sm':''}" src="${a.img}" alt="">`:px(a.icon)}
function detailHTML(a){
  const gal=(a.gallery&&a.gallery.length)?a.gallery.map(s=>`<img src="${s}" alt="Screenshot ${esc(a.name)}">`).join(''):'<div class="ph">Screenshot belum ditambahkan</div>';
  const feats=(a.features||[]).map(f=>`<li>${esc(f)}</li>`).join('');
  return `<a class="back" href="#">&larr; Semua addon</a>
  <div class="dhead"><div class="dicon">${ico(a)}</div><div><div class="cat">${esc(a.cat)}</div><h1>${esc(a.name)}</h1><div class="by">oleh <b>${esc(a.creator)}</b></div></div></div>
  <div class="gal">${gal}</div>
  <a class="btn big" href="${esc(a.link)}" target="_blank" rel="noopener">Download ${esc(a.format)}</a>
  <div class="sec"><h3>Deskripsi</h3><p>${esc(a.long||a.desc)}</p></div>
  ${feats?`<div class="sec"><h3>Fitur</h3><ul>${feats}</ul></div>`:''}
  ${a.howto?`<div class="sec"><h3>Cara pakai</h3><ol>${a.howto.map(h=>`<li>${esc(h)}</li>`).join('')}</ol></div>`:''}
  <div class="sec"><h3>Info</h3><div class="row"><span>Versi Minecraft</span><b>${esc(a.version)}</b></div><div class="row"><span>Format</span><b>${esc(a.format)}</b></div><div class="row"><span>Ukuran</span><b>${esc(a.size)}</b></div><div class="row"><span>Pembuat</span><b>${esc(a.creator)}</b></div></div>
  <div class="sec"><div class="cr"><div class="av">${esc(a.creator.replace(/^@/,'').charAt(0).toUpperCase())}</div><div><b>${esc(a.creator)}</b><p>Pembuat addon ini. Kalau nemu bug, kasih tau ya.</p></div></div><a class="don wide" href="https://sociabuzz.com/misterymimo" target="_blank" rel="noopener">${px('heart')}Dukung pembuat lewat donasi</a></div>`;
}
function route(){
  const a=ADDONS.find(x=>x.id===location.hash.slice(1));
  document.getElementById('home').hidden=!!a;detail.hidden=!a;
  if(a){detail.innerHTML=detailHTML(a);document.title=a.name+' - Addon Hub'}else document.title='Addon Hub';
  window.scrollTo(0,0);
}
addEventListener('hashchange',route);
list.addEventListener('click',e=>{if(e.target.closest('.btn'))return;const c=e.target.closest('.card');if(c)location.hash=c.dataset.id});
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.btn,.card,.tag,.don');if(!el)return;const r=el.getBoundingClientRect(),s=Math.max(r.width,r.height)*2,d=document.createElement('span');d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;el.appendChild(d);setTimeout(()=>d.remove(),600)});
document.getElementById('logo').innerHTML=px('pickaxe');
document.querySelectorAll('.hrt').forEach(e=>e.innerHTML=px('heart'));
render();route();
</script>
