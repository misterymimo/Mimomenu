<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MisteryMimo</title>
<style>
:root{--bg:#f1f5fb;--surface:#fff;--surface2:#e6edf8;--line:#d7e1f0;--text:#0f1a2b;--mute:#5b6b82;--accent:#2563eb;--accent-t:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1018;--surface:#131b28;--surface2:#1b2535;--line:#25324a;--text:#e6edf8;--mute:#8fa0ba;--accent:#60a5fa;--accent-t:#0a1730}}
:root[data-theme="dark"]{--bg:#0b1018;--surface:#131b28;--surface2:#1b2535;--line:#25324a;--text:#e6edf8;--mute:#8fa0ba;--accent:#60a5fa;--accent-t:#0a1730}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% -10%,rgba(59,130,246,.38),transparent 55%),radial-gradient(circle at 100% 100%,rgba(6,182,212,.22),transparent 50%)}
.wrap{position:relative;max-width:480px;margin:0 auto;padding:40px 18px 50px}
.profile{text-align:center;margin-bottom:28px;animation:up .5s cubic-bezier(.2,.8,.2,1) both}
.av{width:112px;height:112px;border-radius:50%;border:3px solid var(--accent);background:#fff;object-fit:cover;display:block;margin:0 auto 14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
h1{margin:0;font-size:1.5rem}
.handle{color:var(--mute);font-size:.95rem;margin-top:2px}
.bio{margin:10px auto 0;color:var(--mute);font-size:.92rem;max-width:300px}
.list{display:flex;flex-direction:column;gap:12px}
.item{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--text);cursor:pointer;opacity:0;animation:up .5s cubic-bezier(.2,.8,.2,1) forwards;transition:border-color .15s,transform .12s}
.item:hover{border-color:var(--accent);transform:translateY(-2px)}
.item:active{transform:scale(.97)}
.item.main{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center}
.main .ic{background:rgba(255,255,255,.25)}
.ic svg{width:30px;height:30px;display:block;shape-rendering:crispEdges}
.t{min-width:0}
.t b{display:block;font-size:1.02rem}
.t span{font-size:.85rem;opacity:.7}
.chev{margin-left:auto;font-size:1.4rem;opacity:.5}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translate(-50%,0)}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.bd{position:absolute;inset:0;background:rgba(0,0,0,.55);animation:fade .25s}
.box{position:relative;width:100%;max-width:480px;max-height:92vh;overflow:auto;background:var(--surface);color:var(--text);border-radius:20px 20px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;animation:slide .35s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.box h2{margin:0 0 4px;font-size:1.2rem}
.box p{margin:0 0 12px;color:var(--mute);font-size:.88rem}
.box img{width:100%;max-width:340px;border-radius:12px;border:1px solid var(--line);display:block;margin:0 auto 14px}
.acts{display:flex;gap:10px}
.acts a,.acts button{flex:1;padding:12px;border-radius:10px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer;text-align:center;text-decoration:none}
.dl{background:var(--accent);color:var(--accent-t);border:0}
.cl{background:transparent;color:var(--text);border:1px solid var(--line)}
@keyframes fade{from{opacity:0}}
@keyframes fadeout{to{opacity:0}}
@keyframes slideout{to{transform:translateY(100%)}}
.sheet.out .bd{animation:fadeout .26s ease-in forwards}
.sheet.out .box{animation:slideout .28s cubic-bezier(.4,0,1,1) forwards}
@keyframes slide{from{transform:translateY(100%)}}
footer{text-align:center;color:var(--mute);font-size:.78rem;margin-top:34px}
/* gradasi biru */
.av{border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#60a5fa,#22d3ee) border-box}
.item.main{background:linear-gradient(135deg,#2563eb,#0ea5e9 60%,#22d3ee);border-color:transparent;color:#fff}
.item:not(.main):hover{border-color:#60a5fa;background:linear-gradient(135deg,var(--surface),color-mix(in srgb,#3b82f6 14%,var(--surface)))}
.dl{background:linear-gradient(135deg,#2563eb,#0ea5e9);color:#fff}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes rip{to{transform:scale(1);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}
</style>
</head>

// ===========================================================
const PAL={s:'#2bc9c0',B:'#a8fff5',t:'#168a8a',h:'#7a4b1f',r:'#d62f45',R:'#ff7a8a',o:'#ff9f43',y:'#ffd23f',p:'#e8b98f',b:'#3a7bd5'};
const ICONS={
 pickaxe:['..sBBBt.','.sBtttBt','sB...hBt','t...h..t','...h....','..h.....','.h......','h.......'],

function px(n){const g=ICONS[n];let r='';g.forEach((row,y)=>{[...row].forEach((c,x)=>{if(PAL[c])r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[c]}"/>`})});return `<svg viewBox="0 0 8 8" xmlns="http://www.w3.org/2000/svg">${r}</svg>`}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const list=document.getElementById('list'),toast=document.getElementById('toast');

const sheet=document.getElementById('sheet');
document.getElementById('qr').src=QRIS;document.getElementById('dl').href=QRIS;
list.addEventListener('click',e=>{const a=e.target.closest('.item');if(a&&a.dataset.modal){e.preventDefault();sheet.classList.remove('out');sheet.hidden=false}});
let closing=false;
function closeSheet(){if(sheet.hidden||closing)return;closing=true;sheet.classList.add('out');setTimeout(()=>{sheet.hidden=true;sheet.classList.remove('out');closing=false},280)}
sheet.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeSheet()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
</script>
